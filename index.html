<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title/description/canonical are rewritten at build time (scripts/seo-build.mjs)
         and kept in sync in the browser (src/hooks/usePageMeta.js). -->
    <title>EagleWing Express | Freight Delivery on Vancouver Island, BC</title>

    <meta name="geo.placename" content="Vancouver Island" />

    <meta property="og:site_name" content="EagleWing Express" />

    <meta property="og:image:alt" content="EagleWing Express — freight across Vancouver Island, BC" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EagleWing Express | Freight Delivery on Vancouver Island, BC" />
    <meta name="twitter:description" content="Parcels, pallets and full loads delivered across Vancouver Island — Victoria to Campbell River. Free quotes." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: business + website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "LocalBusiness",
            "@id": "%VITE_SITE_URL%/#business",
            "name": "EagleWing Express Ltd.",
            "alternateName": "EagleWing Express",
            "description": "Freight and delivery company based on Vancouver Island, British Columbia, moving parcels, pallets and full loads from Victoria to Campbell River.",
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/icon-512.png",
            "image": "%VITE_SITE_URL%/og-image.png",
            "telephone": "+1-236-888-3135",
            "email": "expresseaglewing@gmail.com",
            "priceRange": "Quote-based",
            "address": { "@type": "PostalAddress", "addressRegion": "BC", "addressCountry": "CA" },
            "areaServed": [
              { "@type": "City", "name": "Victoria, BC" },
              { "@type": "City", "name": "Duncan, BC" },
              { "@type": "City", "name": "Ladysmith, BC" },
              { "@type": "City", "name": "Nanaimo, BC" },
              { "@type": "City", "name": "Parksville, BC" },
              { "@type": "City", "name": "Port Alberni, BC" },
              { "@type": "City", "name": "Courtenay, BC" },
              { "@type": "City", "name": "Campbell River, BC" }
            ],
            "openingHoursSpecification": [
              { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "08:00", "closes": "20:00" }
            ],
            "contactPoint": { "@type": "ContactPoint", "telephone": "+1-236-888-3135", "contactType": "customer service", "areaServed": "CA-BC", "availableLanguage": "English" }
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "EagleWing Express",
            "inLanguage": "en-CA",
            "publisher": { "@id": "%VITE_SITE_URL%/#business" }
          }
        ]
      }
    </script>
