<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title/description/canonical are rewritten at build time (scripts/seo-build.mjs)
         and kept in sync in the browser (src/hooks/usePageMeta.js). -->
    <title>EagleWing Express | Vancouver Island Freight & Tailgate Delivery</title>
    <meta name="description" content="Daily freight and tailgate delivery on Vancouver Island, Victoria to Campbell River and Port Alberni, plus a daily run to the Lower Mainland. Free quotes." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#1b1f27" />
    <meta name="geo.region" content="CA-BC" />
    <meta name="geo.placename" content="Vancouver Island" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:site_name" content="EagleWing Express" />
    <meta property="og:title" content="EagleWing Express | Vancouver Island Freight &amp; Tailgate Delivery" />
    <meta property="og:description" content="Daily freight and tailgate delivery on Vancouver Island, Victoria to Campbell River and Port Alberni, plus a daily run to the Lower Mainland. Free quotes." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EagleWing Express — freight across Vancouver Island, BC" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EagleWing Express | Vancouver Island Freight &amp; Tailgate Delivery" />
    <meta name="twitter:description" content="Daily Island freight and tailgate delivery, plus a daily Lower Mainland run. Free quotes." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Fonts -->

    <!-- Structured data: business + website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "LocalBusiness",
            "@id": "%VITE_SITE_URL%/#business",
            "name": "EagleWing Express Ltd.",
            "alternateName": "EagleWing Express",
            "description": "Freight and delivery company based on Vancouver Island, British Columbia, with 3 and 5 ton tailgate trucks running daily from Victoria to Campbell River and Port Alberni, plus a daily run to the Lower Mainland.",
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/icon-512.png",
            "image": "%VITE_SITE_URL%/og-image.png",
            "telephone": "+1-236-888-3135",
            "email": "expresseaglewing@gmail.com",
            "priceRange": "Quote-based",
            "address": { "@type": "PostalAddress", "addressRegion": "BC", "addressCountry": "CA" },
            "areaServed": [
              { "@type": "City", "name": "Victoria, BC" },
              { "@type": "City", "name": "Duncan, BC" },
              { "@type": "City", "name": "Ladysmith, BC" },
              { "@type": "City", "name": "Nanaimo, BC" },
              { "@type": "City", "name": "Parksville, BC" },
              { "@type": "City", "name": "Port Alberni, BC" },
              { "@type": "City", "name": "Courtenay, BC" },
              { "@type": "City", "name": "Campbell River, BC" },
              { "@type": "AdministrativeArea", "name": "Lower Mainland, BC" }
            ],
            "openingHoursSpecification": [
              { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "08:00", "closes": "20:00" }
            ],
            "contactPoint": { "@type": "ContactPoint", "telephone": "+1-236-888-3135", "contactType": "customer service", "areaServed": "CA-BC", "availableLanguage": "English" }
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "EagleWing Express",
            "inLanguage": "en-CA",
            "publisher": { "@id": "%VITE_SITE_URL%/#business" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <!-- Without JavaScript the pre-rendered page text is shown as-is (scroll animations need JS) -->
      <style>
        [class*='reveal'], [class*='reveal'] > *, .word-mask > span, .stop-label, .stop-pop, .grow-x, .route-wipe {
          opacity: 1 !important; transform: none !important; clip-path: none !important;
        }
        .route-wipe { display: none !important; }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
